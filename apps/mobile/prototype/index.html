<!doctype html>
<html lang="id" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Universe Mobile — Prototipe</title>
    <link
      rel="preload"
      href="fonts/figtree-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Figtree, self-hosted (SIL OFL, fonts/OFL.txt): the phone at site is often offline. */
      @font-face {
        font-family: "Figtree";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(fonts/figtree-latin-ext.woff2) format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Figtree";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(fonts/figtree-latin.woff2) format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --bg: #f2f4f7;
        --surface: #ffffff;
        --surface-2: #edf0f4;
        --line: #dce2ea;
        --text: #0b1220;
        --text-2: #46536a;
        --text-3: #5f6b80;
        --action: #0057d9;
        --action-ink: #ffffff;
        --action-soft: #e3edff;
        --hero: #0a2a63;
        --hero-2: #0f3a86;
        --hero-text: #ffffff;
        --hero-text-2: #c9d6f0;
        --brand: #00c0ff;
        --ok: #157a3e;
        --ok-soft: #e1f4e8;
        --warn: #9a5b00;
        --warn-soft: #fdf0d9;
        --bad: #b42323;
        --bad-soft: #fbe4e4;
        --shadow:
          0 6px 18px rgba(11, 18, 32, 0.08), 0 1px 3px rgba(11, 18, 32, 0.06);
        --r-sheet: 22px;
        --r-tile: 14px;
        --r-pill: 999px;
        --stage: #dde3ec;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #111214;
          --surface: #1b1c1f;
          --surface-2: #26282c;
          --line: #34373c;
          --text: #eef2f8;
          --text-2: #a9b4c8;
          --text-3: #8e9ab0;
          --action: #00c8ff;
          --action-ink: #031020;
          --action-soft: #0d2a45;
          --hero: #0a2257;
          --hero-2: #0e2f72;
          --hero-text-2: #b7c6e6;
          --ok: #4ade80;
          --ok-soft: #0e2a1b;
          --warn: #fbbf24;
          --warn-soft: #2e2208;
          --bad: #f87171;
          --bad-soft: #321212;
          --shadow:
            0 8px 22px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.4);
          --stage: #03060d;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #111214;
        --surface: #1b1c1f;
        --surface-2: #26282c;
        --line: #34373c;
        --text: #eef2f8;
        --text-2: #a9b4c8;
        --text-3: #8e9ab0;
        --action: #00c8ff;
        --action-ink: #031020;
        --action-soft: #0d2a45;
        --hero: #0a2257;
        --hero-2: #0e2f72;
        --hero-text-2: #b7c6e6;
        --ok: #4ade80;
        --ok-soft: #0e2a1b;
        --warn: #fbbf24;
        --warn-soft: #2e2208;
        --bad: #f87171;
        --bad-soft: #321212;
        --shadow: 0 8px 22px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.4);
        --stage: #03060d;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--stage);
        font-family: "Figtree", system-ui, sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--action);
        color: var(--action-ink);
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--action);
        outline-offset: 2px;
        border-radius: 8px;
      }
      .num {
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.01em;
      }

      /* stage: the phone beside the prototype controls */
      .stage {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 32px 16px;
      }
      .phone {
        width: 390px;
        height: 844px;
        border-radius: 44px;
        overflow: hidden;
        position: relative;
        background: var(--bg);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        border: 10px solid #0a0d14;
      }
      .screen {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: none;
        padding-bottom: 104px;
      }
      .screen.no-nav {
        padding-bottom: 24px;
      }
      .screen::-webkit-scrollbar {
        display: none;
      }
      .controls {
        width: 280px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .controls h2 {
        margin: 0;
        font-size: 16px;
      }
      .controls p {
        margin: 0;
        font-size: 13px;
        color: var(--text-2);
        line-height: 1.45;
      }
      .ctl-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .ctl-label {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-2);
      }
      .seg {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .seg button {
        border: 1px solid var(--line);
        background: var(--surface-2);
        border-radius: var(--r-pill);
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 600;
        min-height: 36px;
      }
      .seg button[aria-pressed="true"] {
        background: var(--action);
        border-color: var(--action);
        color: var(--action-ink);
      }
      .sample {
        align-self: flex-start;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 9px;
        border-radius: var(--r-pill);
        background: var(--warn-soft);
        color: var(--warn);
      }
      .fab-controls {
        display: none;
      }
      /* At phone width the controls become a band above the phone, so they never sit over app content. */
      @media (max-width: 760px) {
        .stage {
          padding: 36px 0 0;
          display: block;
        }
        .phone {
          width: 100%;
          height: calc(100dvh - 36px);
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
        .controls {
          display: none;
          position: fixed;
          left: 12px;
          right: 12px;
          top: 44px;
          width: auto;
          z-index: 50;
          border: 0;
          box-shadow: var(--shadow);
        }
        .controls.open {
          display: flex;
        }
        .fab-controls {
          display: flex;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          height: 36px;
          z-index: 40;
          align-items: center;
          justify-content: center;
          gap: 6px;
          border: 0;
          border-radius: 0;
          padding: 0 12px;
          font-size: 13px;
          font-weight: 700;
          background: var(--warn-soft);
          color: var(--warn);
        }
        .fab-controls[aria-expanded="true"] svg {
          transform: rotate(180deg);
        }
      }

      /* hero */
      .hero {
        background: linear-gradient(180deg, var(--hero) 0%, var(--hero-2) 100%);
        color: var(--hero-text);
        padding: 20px 18px 56px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .hero-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        font-size: 17px;
        letter-spacing: 0.08em;
      }
      .brand img {
        width: 26px;
        height: 26px;
      }
      .chip {
        font-size: 13px;
        font-weight: 600;
        padding: 7px 12px;
        border-radius: var(--r-pill);
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        white-space: nowrap;
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.1);
        color: inherit;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .hero-main {
        display: flex;
        gap: 14px;
        align-items: stretch;
      }
      .hero-fact {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .unit-code {
        font-size: 48px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
        animation: reveal 520ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .unit-code.small {
        font-size: 40px;
      }
      .status-line {
        font-size: 15px;
        font-weight: 600;
        color: var(--hero-text-2);
        text-wrap: balance;
      }
      .status-line.warn {
        color: #ffd38a;
      }
      .status-line.ok {
        color: #8cf0b4;
      }
      .hero-link {
        margin-top: 4px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 600;
        color: var(--hero-text);
        background: none;
        border: 0;
        padding: 6px 0;
        text-align: left;
      }
      .quick {
        width: 104px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .quick button {
        flex: 1;
        min-height: 74px;
        border-radius: 18px;
        border: 1px solid rgba(0, 192, 255, 0.5);
        background: rgba(3, 10, 30, 0.28);
        color: var(--hero-text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
      }
      .pills {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
        margin: 0 -18px;
        padding: 0 18px;
      }
      .pills::-webkit-scrollbar {
        display: none;
      }
      .pill {
        flex-shrink: 0;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border-radius: var(--r-pill);
        background: rgba(3, 10, 30, 0.32);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: var(--hero-text);
        font-size: 14px;
        font-weight: 600;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 5px;
        background: #9fb0cc;
        flex-shrink: 0;
      }
      .dot.ok {
        background: #34d17a;
      }
      .dot.warn {
        background: #f5b33c;
      }
      .dot.bad {
        background: #ff6a6a;
      }

      /* sheet over the hero */
      .sheet {
        margin-top: -34px;
        background: var(--bg);
        border-radius: var(--r-sheet) var(--r-sheet) 0 0;
        padding: 16px 16px 8px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        position: relative;
      }
      .menu {
        background: var(--surface);
        border-radius: var(--r-sheet);
        padding: 16px 6px 12px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        row-gap: 14px;
        box-shadow: var(--shadow);
      }
      .menu button {
        background: none;
        border: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        padding: 2px;
        text-align: center;
        line-height: 1.25;
      }
      .tile {
        width: 54px;
        height: 54px;
        border-radius: var(--r-tile);
        background: var(--action-soft);
        color: var(--action);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .section {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .section h3 {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
      }
      .section .lead {
        margin: -4px 0 0;
        font-size: 13px;
        color: var(--text-2);
      }
      .duo {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .fact {
        background: var(--surface);
        border-radius: 18px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        box-shadow: var(--shadow);
      }
      .fact .t {
        font-size: 20px;
        font-weight: 800;
        color: var(--action);
      }
      .fact .h {
        font-size: 15px;
        font-weight: 700;
      }
      .fact .s {
        font-size: 13px;
        color: var(--text-2);
      }

      /* inner screens */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 16px 10px;
      }
      .topbar h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 800;
        flex: 1;
      }
      .back {
        width: 44px;
        height: 44px;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: var(--surface);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .body {
        padding: 4px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .group {
        background: var(--surface);
        border-radius: var(--r-sheet);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .row {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        text-align: left;
        min-height: 64px;
      }
      .group > .row:last-child,
      .group > :last-child .row {
        border-bottom: 0;
      }
      .row .ico {
        width: 38px;
        height: 38px;
        border-radius: 19px;
        background: var(--surface-2);
        color: var(--action);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .row .txt {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .row .a {
        font-size: 15px;
        font-weight: 700;
      }
      .row .b {
        font-size: 13px;
        color: var(--text-2);
      }
      .row .end {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        flex-shrink: 0;
      }
      .code {
        font-size: 16px;
        font-weight: 800;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 9px;
        border-radius: var(--r-pill);
        background: var(--surface-2);
        color: var(--text-2);
        white-space: nowrap;
      }
      .badge.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .badge.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .badge.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .badge.info {
        background: var(--action-soft);
        color: var(--action);
      }
      .tabs {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(0, 1fr);
        gap: 4px;
        padding: 4px;
        border-radius: 14px;
        background: var(--surface-2);
      }
      .tabs button {
        min-height: 42px;
        border: 0;
        border-radius: 11px;
        background: none;
        font-size: 14px;
        font-weight: 700;
        color: var(--text-2);
      }
      .tabs button[aria-selected="true"] {
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
      }
      .btn {
        min-height: 52px;
        border-radius: 14px;
        border: 0;
        font-size: 16px;
        font-weight: 800;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn.primary {
        background: var(--action);
        color: var(--action-ink);
      }
      .btn.ghost {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--line);
      }
      .btn.danger {
        background: none;
        color: var(--bad);
        border: 1px solid var(--bad);
      }
      .btn:disabled {
        background: var(--surface-2);
        color: var(--text-3);
        cursor: not-allowed;
      }
      .note {
        font-size: 13px;
        line-height: 1.5;
        color: var(--text-2);
        margin: 0;
      }
      .callout {
        border-radius: 16px;
        padding: 14px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
        font-size: 14px;
        line-height: 1.45;
      }
      .callout.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .callout.info {
        background: var(--action-soft);
        color: var(--text);
      }
      .callout.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .callout svg {
        flex-shrink: 0;
        margin-top: 1px;
      }
      .steps {
        display: flex;
        flex-direction: column;
      }
      .step {
        display: flex;
        gap: 14px;
      }
      .rail {
        width: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .rail .knot {
        width: 14px;
        height: 14px;
        border-radius: 7px;
        border: 3px solid var(--line);
        background: var(--surface);
        margin-top: 3px;
      }
      .rail .knot.done {
        background: var(--ok);
        border-color: var(--ok);
      }
      .rail .knot.now {
        border-color: var(--action);
        background: var(--action);
        box-shadow: 0 0 0 5px var(--action-soft);
      }
      .rail .wire {
        flex: 1;
        width: 2px;
        background: var(--line);
        margin: 4px 0;
      }
      .step .c {
        flex: 1;
        padding-bottom: 16px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .step .c .a {
        font-size: 15px;
        font-weight: 700;
      }
      .step .c .b {
        font-size: 13px;
        color: var(--text-2);
        margin-top: 2px;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
      }
      .cal .wd {
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-3);
      }
      .cal .d {
        min-height: 56px;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        background: var(--surface);
        font-size: 12px;
        color: var(--text-2);
      }
      .cal .d b {
        font-size: 13px;
        color: var(--text);
      }
      .cal .d.D {
        background: var(--action-soft);
      }
      .cal .d.N {
        background: var(--hero);
        color: var(--hero-text-2);
      }
      .cal .d.N b {
        color: #ffffff;
      }
      .cal .d.today {
        outline: 2px solid var(--action);
        outline-offset: 1px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        font-size: 12px;
        color: var(--text-2);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .legend i {
        width: 12px;
        height: 12px;
        border-radius: 4px;
        display: inline-block;
      }
      .idcard {
        background: var(--surface);
        border-radius: 24px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .idcard .top {
        background: linear-gradient(180deg, var(--hero), var(--hero-2));
        color: var(--hero-text);
        padding: 18px;
        display: flex;
        gap: 14px;
        align-items: center;
      }

        justify-content: center;
        font-size: 22px;
        font-weight: 800;
        flex-shrink: 0;
        color: var(--hero-text);

        background: var(--action-soft);
        color: var(--action);

        height: 216px;

        justify-content: center;
        text-align: center;
        font-size: 14px;
        font-weight: 700;
        color: #3a4458;
        padding: 10px;

        height: 10px;
        border-radius: 5px;
        background: var(--surface-2);
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        border-radius: 5px;
        background: var(--action);

        width: 100%;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        background: var(--action);
        color: var(--action-ink);
        border: 0;
        font-size: 14px;
        font-weight: 700;

        height: 330px;
        border-radius: 24px;
        background: #05080f;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c9d3e6;
        font-size: 14px;
        overflow: hidden;
      }
      .viewfinder .frame {
        width: 210px;
        height: 210px;
        position: relative;
      }
      .viewfinder .frame i {
        position: absolute;
        width: 36px;
        height: 36px;
        border: 4px solid var(--brand);
      }
      .viewfinder .frame i:nth-child(1) {
        top: 0;
        left: 0;
        border-right: 0;
        border-bottom: 0;
        border-radius: 12px 0 0 0;
      }
      .viewfinder .frame i:nth-child(2) {
        top: 0;
        right: 0;
        border-left: 0;
        border-bottom: 0;
        border-radius: 0 12px 0 0;
      }
      .viewfinder .frame i:nth-child(3) {
        bottom: 0;
        left: 0;
        border-right: 0;
        border-top: 0;
        border-radius: 0 0 0 12px;
      }
      .viewfinder .frame i:nth-child(4) {
        bottom: 0;
        right: 0;
        border-left: 0;
        border-top: 0;
        border-radius: 0 0 12px 0;
      }

        position: absolute;
        left: 12px;
        right: 12px;
        height: 2px;
        background: var(--brand);
        top: 50%;
        animation: scan 2.2s ease-in-out infinite alternate;
      }
      .viewfinder .hint {
        position: absolute;
        bottom: 18px;
        left: 0;
        right: 0;
        text-align: center;
      }

        height: 50px;
        border-radius: 14px;
        border: 1px solid var(--line);

        position: relative;

        position: absolute;
        left: 14px;
        top: 15px;
        color: var(--text-3);

        flex-direction: column;
        gap: 8px;
      }

        font-size: 14px;
        font-weight: 700;
      }

        background: var(--surface);
        padding: 0 16px;
        font-size: 17px;

        font-size: 14px;

        right: 0;
        bottom: 0;
        height: 88px;
        background: var(--surface);

        grid-template-columns: repeat(5, minmax(0, 1fr));
        align-items: start;
        padding: 8px 4px 0;
        z-index: 20;
      }
      .nav button {
        background: none;
        border: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-3);
        min-height: 56px;
      }

        width: 56px;
        height: 32px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

        color: var(--text);
        font-weight: 800;
      }

        background: var(--action-soft);
        color: var(--action);
      }
      .nav .center .disc {
        width: 62px;
        height: 62px;
        margin-top: -34px;
        border-radius: 31px;
        background: var(--action);
        color: var(--action-ink);
        border: 5px solid var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 14px rgba(3, 6, 14, 0.28);
      }

      /* bottom sheet */
      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(3, 6, 14, 0.55);
        z-index: 30;
        display: flex;
        align-items: flex-end;
        animation: fade 220ms ease-out;
      }
      .bsheet {
        width: 100%;
        max-height: 86%;
        overflow-y: auto;
        background: var(--bg);
        border-radius: 26px 26px 0 0;
        padding: 10px 16px 24px;

        flex-direction: column;
        gap: 14px;
        animation: rise 360ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .grab {
        width: 40px;
        height: 5px;
        border-radius: 3px;
        background: var(--line);
        align-self: center;
        margin-bottom: 4px;
      }
      .bsheet h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
      }
      .toast {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 104px;
        z-index: 40;
        background: var(--text);
        color: var(--bg);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 14px;
        font-weight: 600;
        animation: rise 300ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(10px);
          filter: blur(4px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
      @keyframes rise {
        from {
          transform: translateY(24px);
          opacity: 0.4;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes scan {
        from {
          top: 22%;
        }
        to {
          top: 78%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }

    ${
      op
        ? `<div class="group" style="padding:16px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between"><b style="font-size:17px">Kesiapan hari ini</b><span class="note">Shift Siang</span></div>
      <span><b>${S.state === "holder" ? "1 dari 2" : "2 dari 2"}</b> syarat terpenuhi</span><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="2" aria-valuenow="${S.state === "holder" ? 1 : 2}" aria-label="Syarat masuk unit"><i style="width:${S.state === "holder" ? 50 : 100}%"></i></div>
      <p class="note">${S.state === "holder" ? "FTW sudah lolos. Tinggal finger pertama sebelum 05:25." : "FTW lolos dan finger tercatat 05:03."}</p>
      <button class="btn ghost" type="button" data-go="unit" style="justify-content:space-between">Lihat syarat masuk unit ${ic("arrow", 18)}</button></div>`
        : ""
    }
    <div class="group">${rows.map(([n, a, b]) => `<button class="row" type="button" data-say="${a}"><span class="ico">${ic(n, 20)}</span><span class="txt"><span class="a">${a}</span><span class="b">${b}</span></span>${ic("chev", 16)}</button>`).join("")}</div>
    <button class="btn danger" type="button" data-go="login">Keluar</button></div>`
        );
      }
      function sheetHtml() {
        if (!S.sheet) return "";
        if (S.sheet.type === "place") {
          const chosen = CANDS.find((c) => c[1] === S.pick);
          const needAck = chosen && !chosen[3];
          const blocked = !chosen || (needAck && !S.ack);
          return `<div class="scrim" data-close="1"><div class="bsheet" role="dialog" aria-modal="true" aria-label="Isi unit ${S.sheet.unit}"><span class="grab"></span><h2>Isi unit <span class="num">${S.sheet.unit}</span></h2>
      <p class="note">Kandidat yang memegang SIMPER unit ini, urut jam tap.</p>
      ${CANDS.map(([n, k, t, ok]) => `<button class="cand" type="button" aria-pressed="${S.pick === k}" data-cand="${k}"><span class="txt" style="flex:1;display:flex;flex-direction:column;gap:2px"><b>${n}</b><span class="note num">NIK ${k} · tap ${t}</span></span>${ok ? badge("FTW lolos", "ok") : badge("FTW tidak lolos", "bad")}</button>`).join("")}
      ${needAck ? `<label class="check callout warn"><input type="checkbox" ${S.ack ? "checked" : ""} data-ack="1"><span>Operator ini tidak lolos FTW untuk unit yang mensyaratkannya. Saya tetap menempatkan, dan konfirmasi ini dicatat atas nama saya.</span></label>` : ""}
      <button class="btn primary" type="button" ${blocked ? "disabled" : ""} data-confirm="1">${chosen ? "Tempatkan " + chosen[0] : "Pilih kandidat"}</button></div></div>`;
        }
        if (S.sheet.type === "acct") {
          return `<div class="scrim" data-close="1"><div class="bsheet" role="dialog" aria-modal="true" aria-label="Akun ${S.sheet.name}"><span class="grab"></span><h2>${S.sheet.name}</h2><p class="note num">NIK ${S.sheet.nik}</p>
      <button class="btn ghost" type="button" data-say="Password ${S.sheet.name} direset. Login berikutnya harus dari jaringan site.">Reset password</button>
      <p class="note">Password kembali ke password awal. Login berikutnya harus dari jaringan site.</p>
      <button class="btn danger" type="button" data-say="Akun ${S.sheet.name} dinonaktifkan">Nonaktifkan akun</button></div></div>`;
        }
        return "";
      }
      function render() {
        document.documentElement.dataset.theme = S.theme;
        const key =
          S.screen === "login" || S.screen === "soon"
            ? `any:${S.screen}`
            : `${S.role}:${S.screen}`;
        const view =
          V[key] ||
          (S.screen.startsWith("riwayat")
            ? V["operator:riwayat"]
            : V["any:soon"]);
        const nav = NAV[S.role];
        const active =
          {
            "riwayat-ftw": "riwayat",
            "riwayat-hadir": "riwayat",
            unit: S.role === "operator" ? "home" : "unit-status",
            notif: "home",
            cari: "home",
          }[S.screen] || S.screen;
        const showNav = S.screen !== "login";
        document.getElementById("phone").innerHTML =
          `<div class="screen ${showNav ? "" : "no-nav"}">${view()}</div>
    ${showNav ? `<nav class="nav" aria-label="Navigasi utama">${nav.map(([k, l, n, c]) => (c ? `<button class="center" type="button" data-go="${k}" ${active === k ? 'aria-current="page"' : ""}><span class="disc">${ic(n, 26, 2.2)}</span>${l}</button>` : `<button type="button" data-go="${k}" ${active === k ? 'aria-current="page"' : ""}><span class="halo">${ic(n, 21)}</span>${l}</button>`)).join("")}</nav>` : ""}
    ${sheetHtml()}${S.toast ? `<div class="toast" role="status">${S.toast}</div>` : ""}`;
        const seg = (id, items, cur, fn) => {
          document.getElementById(id).innerHTML = items
            .map(
              ([k, l]) =>
                `<button type="button" aria-pressed="${cur === k}" data-${fn}="${k}">${l}</button>`
            )
            .join("");
        };
        seg(
          "ctl-role",
          [
            ["operator", "Operator"],
            ["pengawas", "Pengawas"],
            ["admin", "Superadmin"],
          ],
          S.role,
          "role"
        );
        seg(
          "ctl-state",
          [
            ["holder", "Pegangan (rencana)"],
            ["spare", "Spare · breakdown"],
            ["final", "Final setelah 05:26"],
          ],
          S.state,
          "state"
        );
        seg(
          "ctl-theme",
          [
            ["auto", "Ikut HP"],
            ["light", "Terang"],
            ["dark", "Gelap"],
          ],
          S.theme,
          "theme"
        );
        document.getElementById("ctl-state-wrap").style.display =
          S.role === "operator" ? "" : "none";
      }
      document.addEventListener("click", (e) => {
        const t = e.target.closest("button, .scrim, input");
        if (!t) return;
        const d = t.dataset;
        if (d.close && e.target === t) {
          S.sheet = null;
          render();
          return;
        }
        if (d.go) {
          const map = {
            "riwayat-ftw": ["riwayat", "ftw"],
            "riwayat-hadir": ["riwayat", "hadir"],
            riwayat: ["riwayat", "unit"],
          };
          if (map[d.go]) return go(map[d.go][0], { tab: map[d.go][1] });
          if (d.go === "papan-kosong") return go("papan", { filter: "empty" });
          return go(d.go, {
            tab: d.go === "unit-status" ? "breakdown" : S.tab,
            scanned: d.go === "scan" ? false : S.scanned,
            filter: d.go === "papan" ? "all" : S.filter,
          });
        }
        if (d.tab) {
          S.tab = d.tab;
          render();
        }
        if (d.filter) {
          S.filter = d.filter;
          render();
        }
        if (d.role) return go("home", { role: d.role, filter: "all" });
        if (d.state) {
          S.state = d.state;
          render();
        }
        if (d.theme) {
          S.theme = d.theme;
          render();
        }
        if (d.place) {
          S.sheet = { type: "place", unit: d.place };
          S.pick = null;
          S.ack = false;
          render();
        }
        if (d.cand) {
          S.pick = d.cand;
          S.ack = false;
          render();
        }
        if (d.ack) {
          S.ack = t.checked;
          render();
        }
        if (d.confirm) {
          const c = CANDS.find((x) => x[1] === S.pick);
          const unit = S.sheet.unit;
          S.sheet = null;
          say(`${c[0]} ditempatkan di ${unit}`);
        }
        if (d.acct) {
          const [name, nik] = d.acct.split("|");
          S.sheet = { type: "acct", name, nik };
          render();
        }
        if (d.say) {
          S.sheet = null;
          say(d.say);
        }
        if (d.scan) {
          S.scanned = true;
          render();
        }
        if (d.rescan) {
          S.scanned = false;
          render();
        }
        if (d.login) go("home");
      });
      /* Typing in Cari refreshes only the results, so the field keeps focus. */
      document.addEventListener("input", (e) => {
        if (!e.target.dataset.find) return;
        S.q = e.target.value;
        document.getElementById("find-results").innerHTML = findResults(S.q);
      });
      document.getElementById("fab").addEventListener("click", (e) => {
        const open = document
          .getElementById("controls")
          .classList.toggle("open");
        e.currentTarget.setAttribute("aria-expanded", String(open));
      });
      /* A link can open the prototype on one case: ?role=pengawas&screen=papan&theme=dark. */
      const q = new URLSearchParams(location.search);
      for (const k of [
        "role",
        "state",
        "theme",
        "screen",
        "tab",
        "filter",
        "q",
      ])
        if (q.get(k)) S[k] = q.get(k);
      render();
    </script>
  </body>
</html>
