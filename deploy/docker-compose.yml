# On-premise deployment: everything the application needs, on one host.
#
#   cd deploy && cp .env.example .env   # then fill it in
#   docker compose build && docker compose up -d
#
# Only Caddy publishes a port. Postgres and Redis are reachable only from
# inside the compose network — deliberately, because Redis holds the sessions
# and has historically run here without a password.
name: universe

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Without this the cluster is initialised with the image's default
      # collation, and a later restore from a differently-collated dump fails
      # on index ordering rather than at the point of the mistake.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # A password even on a private network: sessions live here, and "only
    # reachable from the compose network" is a property of today's topology,
    # not a guarantee about tomorrow's.
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot. Runs to completion before the API starts, so the API never serves
  # against a schema it does not expect.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: universe-api:latest
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["bun", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    # Same context and tag as `migrate`, deliberately: one image serves the API
    # and runs the migration and bootstrap commands, so what applies a
    # migration is always exactly what will then serve against it. Declaring
    # the build on both means `docker compose up` never tries to pull a tag
    # that only exists locally.
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: universe-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3001
      # Shift boundaries, roster dates and every scheduler stage are compared
      # against the *process's* local clock. A container defaults to UTC, which
      # silently shifts every one of them by the site's offset: at 20:40 WITA
      # the wall asks for 12:40 and is honestly told the day shift is running.
      TZ: ${TZ:-Asia/Makassar}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Same origin through Caddy, so this is belt-and-braces rather than the
      # thing that makes requests work.
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
      # Plain HTTP for now: a browser silently discards a Secure cookie over
      # HTTP, so turning this on before TLS terminates in front breaks login
      # with no error anywhere. See docs/deploy.md.
      COOKIE_SECURE: "false"
      SOUND_DIR: /data/sounds
      PHOTO_DIR: /data/photos
      IMPORT_DIR: /data/imports
    volumes:
      # Named volume, not a container layer: the database stores only the file
      # *name*, so losing this directory leaves rows pointing at photos that no
      # longer exist.
      - apidata:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e ''await fetch("http://localhost:3001/health").then(r=>{if(!r.ok)process.exit(1)})''',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle at build time — changing it means
        # rebuilding this image, not restarting the container.
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN}
    image: universe-web:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Makassar}
      # Server Components render inside this container, where PUBLIC_ORIGIN —
      # the host's published port, reached back through the proxy — need not be
      # routable. The browser bundle is unaffected: it keeps the build-time
      # NEXT_PUBLIC_API_URL above.
      INTERNAL_API_URL: http://api:3001
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  redisdata:
  apidata:
  caddydata:
  caddyconfig:
